name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: win-x64
          - os: macos-latest
            rid: osx-x64
            artifact: osx-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish
        run: >
          dotnet publish mosair/mosair.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.VERSION }}
          -o out

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path out/* -DestinationPath ${{ matrix.artifact }}.zip
        shell: pwsh

      - name: Build .app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="mosair.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R out/. "$APP/Contents/MacOS/"
          mv "$APP/Contents/MacOS/Info.plist" "$APP/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$VERSION" "$APP/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$APP/Contents/Info.plist"

          # .ico -> .icns
          sips -s format png mosair/Assets/mosair.ico --out icon.png
          mkdir mosair.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s icon.png --out mosair.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) icon.png --out mosair.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns mosair.iconset -o "$APP/Contents/Resources/mosair.icns"

          chmod +x "$APP/Contents/MacOS/mosair"
          # Ad-hoc imza: Apple Developer hesabi olmadan da Gatekeeper
          # "Open Anyway" ile acilabilsin ("hasarli" uyarisi vermesin)
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dmg
          cp -R mosair.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname mosair -srcfolder dmg -ov -format UDZO ${{ matrix.artifact }}.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.dmg
